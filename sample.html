<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLサンプル</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            column-gap: 20px;
            row-gap: 10px;
        }

        .item1 {
            grid-column-start: 1;
            grid-column-end: 4;
        }

        .item2 {
            grid-row-start: 2;
            grid-row-end: 4;
        }
    </style>
</head>
<body>
    <ul class="container">
        <li class="item1">item1</li>
        <li class="item2">item2</li>
        <li class="item3">item3</li>
        <li class="item4">item4</li>
        <li class="item5">item5</li>
        <li class="item6">item6</li>
    </ul>

    <dl>
        <dt>ゾウ</dt>
        <dd>鼻が長い動物</dd>
        <dt>キリン</dt>
        <dd>首が長い動物</dd>
    </dl>
</body>

</html>
