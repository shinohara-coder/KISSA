<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLサンプル</title>
    <style>
        .flex-container {
            height: 200px;
            width: 500px;
            display: flex;
            align-items: center;
        }

        .flex-item1 {
            background-color: red;
            height: 30px;
            width: 300px;
            flex-shrink: 0;
            flex-shrink: 1;
        }

        .flex-item2 {
            background-color: yellowgreen;
            height: 80px;
            width: 300px;
            flex-shrink: 2;
        }

        .flex-item3 {
            background-color: blue;
            height: 50px;
            width: 300px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <ul class="flex-container">
        <li class="flex-item1">item1</li>
        <li class="flex-item2">item2</li>
        <li class="flex-item3">item3</li>
    </ul>

    <dl>
        <dt>ゾウ</dt>
        <dd>鼻が長い動物</dd>
        <dt>キリン</dt>
        <dd>首が長い動物</dd>
    </dl>
</body>

</html>
